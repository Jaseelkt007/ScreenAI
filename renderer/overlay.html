<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>ScreenAI</title>
  <link rel="stylesheet" href="overlay.css" />
</head>
<body>
  <div id="app">

    <!-- ── Header ────────────────────────────────────────────────────────── -->
    <div id="header">
      <div id="header-left">
        <!-- Filled dot logo + wordmark -->
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none"
             xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="5" cy="5" r="4" fill="#00c8ef" fill-opacity="0.85"/>
          <circle cx="5" cy="5" r="2" fill="#fff" fill-opacity="0.6"/>
        </svg>
        <span id="title">ScreenAI</span>
      </div>

      <div id="header-right">
        <!-- Turn counter badge (hidden until first turn) -->
        <div id="turn-counter" class="hidden" title="Conversation turns used">
          <span id="turns-used">0</span><span class="turns-sep">/</span><span id="turns-max">3</span>
        </div>

        <!-- Theme toggle: shows moon in dark mode, sun in light mode -->
        <button id="theme-btn" title="Toggle light / dark theme" aria-label="Toggle theme">
          <!-- Moon (shown when dark) -->
          <svg class="icon-moon" width="13" height="13" viewBox="0 0 13 13" fill="none">
            <path d="M11 8.5A5.5 5.5 0 0 1 4.5 2a5.5 5.5 0 1 0 6.5 6.5z"
                  fill="currentColor"/>
          </svg>
          <!-- Sun (shown when light) -->
          <svg class="icon-sun" width="13" height="13" viewBox="0 0 13 13" fill="none">
            <circle cx="6.5" cy="6.5" r="2.5" fill="currentColor"/>
            <path d="M6.5 1v1.5M6.5 10.5V12M1 6.5h1.5M10.5 6.5H12
                     M2.93 2.93l1.06 1.06M9.01 9.01l1.06 1.06
                     M2.93 10.07l1.06-1.06M9.01 3.99l1.06-1.06"
                  stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
        </button>

        <!-- Close -->
        <button id="close-btn" title="Close (Esc)" aria-label="Close">
          <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
            <path d="M1 1l8 8M9 1L1 9" stroke="currentColor" stroke-width="1.5"
                  stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- ── Split main area ───────────────────────────────────────────────── -->
    <div id="main">

      <!-- LEFT: Screenshot context ─────────────────────────────────────── -->
      <div id="left-panel">
        <div id="screenshot-frame">
          <img id="screenshot-img" alt="Captured screen region" />
          <!-- Retake: compact icon overlay in the top-right corner -->
          <button id="retake-btn" title="Capture a new region (closes this panel)" aria-label="Retake screenshot">
            <svg width="11" height="11" viewBox="0 0 11 11" fill="none">
              <path d="M9.5 5.5A4 4 0 1 1 8 2.1" stroke="currentColor"
                    stroke-width="1.4" stroke-linecap="round"/>
              <path d="M8 1v2H6" stroke="currentColor" stroke-width="1.4"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- RIGHT: Conversation ──────────────────────────────────────────── -->
      <div id="right-panel">

        <!-- Chat scroll area -->
        <div id="chat-messages">
          <div id="placeholder">
            <svg width="28" height="28" viewBox="0 0 28 28" fill="none"
                 aria-hidden="true" style="margin-bottom:8px;opacity:0.18">
              <rect x="2" y="2" width="24" height="24" rx="6"
                    stroke="currentColor" stroke-width="1.5"/>
              <path d="M9 14h10M14 9v10" stroke="currentColor" stroke-width="1.5"
                    stroke-linecap="round"/>
            </svg>
            <p>Ask anything about what's on screen.</p>
            <p>
              <kbd>&#9166;</kbd> to ask
              &nbsp;&middot;&nbsp;
              <kbd>Shift</kbd><kbd>&#9166;</kbd> for new line
            </p>
          </div>
        </div>

        <!-- Input footer (fixed at bottom of right panel) -->
        <div id="input-footer">
          <div id="input-row">
            <textarea
              id="question-input"
              placeholder="Ask about this screen…"
              rows="1"
              spellcheck="false"
              autofocus
            ></textarea>
            <button id="send-btn" aria-label="Send">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                <path d="M1 7h12M7 1l6 6-6 6" stroke="currentColor" stroke-width="1.5"
                      stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
          <div id="input-hints">
            <span><kbd>&#9166;</kbd> to ask</span>
            <span><kbd>Shift</kbd> + <kbd>&#9166;</kbd> for new line</span>
          </div>
        </div>

      </div>
    </div>

  </div>

  <script src="markdown.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
