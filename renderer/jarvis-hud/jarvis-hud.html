<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' blob:;">
  <title>Jarvis</title>
  <link rel="stylesheet" href="jarvis-hud.css">
</head>
<body>

  <!-- ── Top row: orb + status label + close ── -->
  <div id="top-row">
    <div id="orb" class="orb-idle"></div>
    <span id="status-label">Jarvis</span>
    <button id="close-btn" title="Close">✕</button>
  </div>

  <!-- ── Listening row: mic icon + level meter + stop button (M3 voice) ── -->
  <div id="listen-row" class="hidden">
    <span id="mic-icon">🎙</span>
    <div id="level-bar">
      <div id="level-fill"></div>
    </div>
    <button id="stop-btn" title="Stop recording (or press F9)">■</button>
  </div>

  <!-- ── Transcript preview (shown once classifying) ── -->
  <div id="transcript" class="hidden"></div>

  <!-- ── Text input (debug fallback — hidden by default in M3) ── -->
  <div id="input-row" class="hidden">
    <input id="cmd-input" type="text" placeholder="Type a command…" autocomplete="off" spellcheck="false">
    <button id="send-btn">→</button>
  </div>

  <!-- ── Confirm bar (shown during confirmation requests) ── -->
  <div id="confirm-bar" class="hidden">
    <span id="confirm-msg"></span>
    <div id="confirm-actions">
      <button id="confirm-ok-btn" class="btn-confirm">Enter ↵</button>
      <button id="confirm-cancel-btn" class="btn-cancel">Esc</button>
    </div>
  </div>

  <!-- ── Disambiguation bar (M4.1) — shown when multiple file matches found ── -->
  <div id="disambiguate-bar" class="hidden">
    <span id="disambiguate-prompt">Which one?</span>
    <ol id="disambiguate-list"></ol>
  </div>

  <!-- ── Context badge (M4.5) — shows active file/window target ── -->
  <div id="context-badge" class="hidden">
    <span id="context-badge-icon">◈</span>
    <span id="context-badge-text"></span>
  </div>

  <!-- ── Result / error bar ── -->
  <div id="result-bar" class="hidden">
    <span id="result-text"></span>
  </div>

  <!-- ── Plan progress (M5.0) — shows "Step 2/5: Searching the web…" -->
  <div id="plan-progress" class="hidden">
    <div id="plan-progress-row">
      <span id="plan-progress-step">Step 1/1</span>
      <span id="plan-progress-narration">Working…</span>
    </div>
    <div id="plan-progress-bar"><div id="plan-progress-fill"></div></div>
  </div>

  <!-- ── Result panel (M5.4) — voice-pickable cards -->
  <div id="result-panel" class="hidden">
    <div id="result-panel-header">
      <span id="result-panel-title">Results</span>
      <span id="result-panel-hint">Say a number, or press 1–9</span>
    </div>
    <ol id="result-panel-list"></ol>
  </div>

  <script src="jarvis-hud.js"></script>
</body>
</html>
