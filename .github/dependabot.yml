version: 2

updates:
  # ── npm dependencies ───────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
    open-pull-requests-limit: 10

    # Block ALL major version bumps for every npm package.
    # Major bumps (0.x→1.x, 1.x→2.x, etc.) almost always contain breaking
    # API changes that require code updates before upgrading. Since this
    # project has no automated tests yet, a major bump can silently break
    # the build (as happened when jimp 0.x→1.x broke create-icon.js).
    # Upgrade major versions manually after reading the changelog.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

    groups:
      # electron + electron-builder must stay in sync — bump them together.
      # Major bumps are blocked above, so only minor/patch land here.
      electron:
        patterns:
          - "electron"
          - "electron-builder"
        update-types:
          - "minor"
          - "patch"

    # Runtime deps (jimp, node-fetch, form-data, screenshot-desktop) are
    # intentionally NOT grouped — each gets its own PR so a breakage in
    # one dep is easy to identify and revert without touching the others.

  # ── GitHub Actions ─────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
    open-pull-requests-limit: 5
    # GitHub Actions major versions (e.g. actions/checkout@v4→v6) are
    # intentionally allowed — action authors use major tags as stable
    # release channels and document migrations clearly in their changelogs.
