version: 2

updates:
  # ── npm dependencies ───────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
    open-pull-requests-limit: 5
    groups:
      # Batch all Electron-related upgrades into one PR
      electron:
        patterns:
          - "electron"
          - "electron-builder"
      # Batch all renderer/image processing deps
      runtime-deps:
        patterns:
          - "jimp"
          - "node-fetch"
          - "form-data"
          - "screenshot-desktop"
    ignore:
      # Major Electron bumps need manual testing — only auto-update patch/minor
      - dependency-name: "electron"
        update-types: ["version-update:semver-major"]

  # ── GitHub Actions ─────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
    open-pull-requests-limit: 3
