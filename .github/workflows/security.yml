name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Run every Monday at 08:00 UTC so new CVEs are caught between PRs
    - cron: '0 8 * * 1'

permissions:
  contents: read

jobs:
  # ── Dependency vulnerability audit ────────────────────────────────────────
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Audit for high/critical vulnerabilities
        # Fails the job if any HIGH or CRITICAL CVE is found in production deps.
        # Dev-only vulnerabilities (electron-builder, etc.) are reported but
        # do not block the build — they never ship to end users.
        run: |
          echo "=== Production dependency audit ==="
          npm audit --omit=dev --audit-level=high || {
            echo "::error::High or critical vulnerability found in production dependencies."
            exit 1
          }
          echo "=== Dev dependency audit (informational) ==="
          npm audit --audit-level=critical || true

  # ── Secret scanning (gitleaks) ────────────────────────────────────────────
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # full history — scan every commit, not just HEAD

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No GITLEAKS_LICENSE needed for public repos
