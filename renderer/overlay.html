<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>ScreenAI</title>
  <link rel="stylesheet" href="overlay.css" />
</head>
<body>
  <div id="hud" data-state="idle" data-mode="compact">

    <!-- ── Compact liquid-glass pill (F7 initial state) ───────────────── -->
    <div id="compact-bar" aria-label="Ask anything">
      <div class="cbar-shine" aria-hidden="true"></div>
      <div class="cbar-sheen" aria-hidden="true"></div>

      <div id="cbar-icon" aria-hidden="true">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
          <path d="M12 3L9.5 9.5H3L8.5 13.5L6 20L12 16L18 20L15.5 13.5L21 9.5H14.5L12 3Z"
                fill="rgba(255,255,255,0.85)" />
        </svg>
      </div>

      <input
        id="compact-input"
        type="text"
        placeholder="Ask anything…"
        autocomplete="off"
        spellcheck="false"
        autofocus
      />

      <button id="compact-send" aria-label="Send">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
          <path d="M12 19V5M5 12l7-7 7 7"
                stroke="rgba(255,255,255,0.95)" stroke-width="2.4"
                stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
    </div>

    <!-- ── F7 Expanded Chat Panel ─────────────────────────────────────── -->
    <div id="f7-panel">

      <!-- Drag handle / top bar -->
      <div id="f7-topbar">
        <div id="f7-brand" aria-hidden="true">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none">
            <path d="M12 3L9.5 9.5H3L8.5 13.5L6 20L12 16L18 20L15.5 13.5L21 9.5H14.5L12 3Z"
                  fill="rgba(190,168,255,0.88)" />
          </svg>
          <span>ScreenAI</span>
        </div>

        <div id="f7-thumb-frame" title="Captured region">
          <img id="screenshot-img" alt="Captured screen region" />
        </div>

        <button id="close-btn" title="Close (Esc)" aria-label="Close">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none">
            <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2.5"
                  stroke-linecap="round" />
          </svg>
        </button>
      </div>

      <!-- Chat messages -->
      <div id="chat-messages">
        <div id="placeholder">
          <svg id="placeholder-mark" width="40" height="40" viewBox="0 0 56 56" fill="none"
               aria-hidden="true">
            <circle cx="28" cy="28" r="20" stroke="currentColor" stroke-opacity="0.18"
                    stroke-width="1.5" />
            <circle cx="28" cy="28" r="10" stroke="currentColor" stroke-opacity="0.28"
                    stroke-width="1.5" />
            <circle cx="28" cy="28" r="3" fill="currentColor" fill-opacity="0.6" />
          </svg>
          <p class="placeholder-title">Ask about the captured region.</p>
          <p class="placeholder-hint">
            <kbd>&#9166;</kbd> send &middot;
            <kbd>Shift</kbd><kbd>&#9166;</kbd> new line
          </p>
        </div>
      </div>

      <!-- Composer / input area -->
      <div id="f7-composer">
        <div id="f7-input-pill">
          <textarea
            id="question-input"
            placeholder="Ask a follow-up…"
            rows="1"
            spellcheck="false"
          ></textarea>
          <button id="send-btn" aria-label="Send">
            <span class="btn-text">↑</span>
          </button>
        </div>
      </div>

    </div><!-- /#f7-panel -->

    <!--
      Hidden legacy stubs — keep overlay.js getElementById references valid
      without showing any of the old Jarvis UI elements.
    -->
    <div id="overlay-legacy" aria-hidden="true" style="display:none">
      <div id="phase-badge"></div>
      <span id="conversation-label"></span>
      <span id="conversation-meta"></span>
      <span id="input-meta"></span>
      <div id="capture-chip"></div>
      <div id="turn-counter">
        <span id="turns-used">0</span>
        <span class="turns-sep">/</span>
        <span id="turns-max">3</span>
      </div>
      <div id="input-footer"></div>
      <button id="retake-btn"></button>
    </div>

  </div>

  <script src="markdown.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
